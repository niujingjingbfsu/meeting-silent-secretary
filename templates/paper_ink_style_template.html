<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分享要点卡片 · 样式锁定模板（仅供参考结构，不要直接对外使用本文件）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================
   主题（Paper & Ink 预设，2026-08-01 晶晶要求：分享要点卡片改用这套，替换掉
   Scatterbrain 便利贴风——她的原话是"高级一点的、安静一点的、浅色的"。
   来源：frontend-slides 技能自带的 STYLE_PRESETS.md「12. Paper & Ink」条目
   （Vibe: Editorial, literary, thoughtful；暖米白 + 炭灰 + 暗红点缀；
   Cormorant Garamond + Source Serif 4 衬线字体；signature 是 drop caps / pull
   quotes / 优雅横线——pull quote 这个元素刚好直接拿来承载"金句独立页"）。
   这份文件只给"分享要点卡片"技能用，跟"实时会议Slides"在用的 Scatterbrain 模板
   （slides_style_template.html）完全独立、互不影响，改这份不会波及那份。

   跟 Scatterbrain 模板同一套结构约定（沿用不重新发明）：.presentation/.slide/
   .slide-content/.page-tag 这几个 class 名字和翻页 JS 逻辑原样复用，只是内部
   视觉从"便利贴+软木板"换成"编辑排版+衬线字体+克制留白"，方便以后维护两套
   模板时不用记两套不同的骨架规则。

   CJK 兜底（沿用 Scatterbrain 模板同样的必做处理）：Cormorant Garamond / Source
   Serif 4 都不带中文字形，中文会静默回退丢失设计感——每个 font-family 列表尾部
   追加 'Noto Serif SC' 作为中文兜底，粗细手动对齐（Cormorant 用到 600/700 时，
   中文对应配 Noto Serif SC 600/700，避免"英文很挺括、中文发虚"的重量不对称）。
   =========================================== */
:root {
    --cream: #faf7f2;
    --paper: #f5f1ea;
    --ink: #262220;
    --ink-soft: #5a5450;
    --ink-faint: #8a827b;
    --crimson: #9c2b2b;
    --crimson-soft: #b8544f;
    --rule: rgba(38, 34, 32, 0.18);
    --shadow: rgba(38, 34, 32, 0.08);
    --font-display: 'Cormorant Garamond', 'Noto Serif SC', serif;
    --font-body: 'Source Serif 4', 'Noto Serif SC', serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: var(--font-body);
    background: var(--cream);
    color: var(--ink);
    overflow: hidden;
    cursor: default;
    height: 100vh;
}

.presentation { position: relative; width: 100vw; height: 100vh; }

.slide {
    width: 100vw; height: 100vh;
    position: absolute; top: 0; left: 0;
    display: none;
    align-items: center; justify-content: center;
    overflow: hidden;
    padding: 4rem 6rem;
    background: var(--cream);
}
.slide.active { display: flex; }
.slide.bg-paper { background: var(--paper); }

.slide-content { position: relative; z-index: 1; max-width: 900px; width: 100%; }

/* 细横线——取代便利贴/图钉，作为唯一的装饰语言，克制、editorial */
.accent-rule {
    width: 64px; height: 2px;
    background: var(--crimson);
    margin: 0 auto 1.75rem;
}
.accent-rule.left { margin: 0 0 1.75rem; }

h1, h2, h3 {
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--ink);
    line-height: 1.15;
    letter-spacing: 0.01em;
}
h1 { font-size: clamp(2.6rem, 5vw, 4.2rem); }
h2 { font-size: clamp(2rem, 4vw, 3.2rem); }
h3 { font-size: clamp(1.3rem, 2.2vw, 1.7rem); font-weight: 500; }
p {
    font-family: var(--font-body);
    font-size: clamp(1rem, 1.4vw, 1.2rem);
    line-height: 1.75;
    color: var(--ink-soft);
    font-weight: 300;
}
.eyebrow {
    font-family: var(--font-body);
    font-size: 0.85rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--crimson);
    font-weight: 600;
}

/* ===== 标题页 ===== */
.slide-title { flex-direction: column; text-align: center; }
.title-block { max-width: 720px; }
.title-block h1 { margin-top: 1rem; }
.subtitle-text {
    margin-top: 1.75rem; font-family: var(--font-body); font-style: italic;
    font-size: 1.25rem; color: var(--ink-faint); font-weight: 300;
}

/* ===== 观点页：大字宣言 + 支撑理由（取代便利贴的 statement/side-note）===== */
.viewpoint-layout {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 2.5rem; max-width: 780px; margin: 0 auto;
}
.viewpoint-statement h2 { line-height: 1.25; }
.support-notes {
    display: flex; flex-direction: column; gap: 1.1rem;
    text-align: left; width: 100%;
    border-top: 1px solid var(--rule);
    padding-top: 1.75rem;
}
.support-note { display: flex; gap: 1rem; align-items: baseline; }
.support-note .bullet { color: var(--crimson); font-family: var(--font-display); font-size: 1.3rem; flex-shrink: 0; }
.support-note p { margin: 0; }
.support-label {
    font-family: var(--font-body); font-size: 0.8rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: 0.5rem;
    text-align: left; width: 100%;
}

/* ===== 金句页：pull quote（Paper & Ink 的标志元素，独立成页时用这套）===== */
.slide-quote { text-align: center; }
.pull-quote { max-width: 780px; position: relative; }
.pull-quote .quote-mark {
    font-family: var(--font-display); font-size: 5rem; color: var(--crimson);
    line-height: 1; opacity: 0.35; display: block; margin-bottom: -1.5rem;
}
.pull-quote blockquote {
    font-family: var(--font-display); font-style: italic; font-weight: 500;
    font-size: clamp(1.8rem, 3.6vw, 3rem); line-height: 1.35; color: var(--ink);
}
.pull-quote .attribution {
    margin-top: 2rem; font-family: var(--font-body); font-size: 0.95rem;
    color: var(--ink-faint); letter-spacing: 0.05em;
}
.pull-quote .attribution::before { content: '— '; }

/* ===== 页码指示器（跟 Scatterbrain 模板同一个 class 名 .page-tag，视觉换成
   安静的编辑体小字号，不用亮色徽章/图钉这套装饰语言）===== */
.page-tag {
    position: fixed;
    right: 3rem; bottom: 2rem;
    z-index: 1000;
    font-family: var(--font-body);
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    pointer-events: none;
}

@media (max-width: 900px) {
    .slide { padding: 2.5rem; }
}

@media print {
    .slide { page-break-after: always; min-height: 100vh; }
    .page-tag { display: none; }
}
</style>
</head>
<body>
<!-- 以下 body 结构仅供参考：展示标题页/观点页/金句页三种类型，正文示例内容生成时
     必须替换为本轮真实分享内容，不要照抄。 -->
<div class="presentation">

  <section class="slide slide-title active">
    <div class="slide-content title-block">
      <p class="eyebrow">分享要点</p>
      <h1>示例标题（生成时替换为本次分享的核心主题）</h1>
      <div class="accent-rule"></div>
      <p class="subtitle-text">示例副标题——写"核心观点整理中，会跟着分享内容持续更新"（占位生成时用这句）。</p>
    </div>
    <div class="page-tag">1 / 3</div>
  </section>

  <section class="slide bg-paper">
    <div class="slide-content">
      <div class="viewpoint-layout">
        <div class="viewpoint-statement">
          <h2>示例核心观点——一句话讲清楚，字要少、够醒目</h2>
        </div>
        <div class="support-notes">
          <p class="support-label">支撑理由</p>
          <div class="support-note"><span class="bullet">—</span><p>示例支撑理由一：如实反映分享者实际讲的理由，没有明确理由支撑就如实呈现观点本身。</p></div>
          <div class="support-note"><span class="bullet">—</span><p>示例支撑理由二（1-3条即可，不是大段论述文字堆砌）。</p></div>
        </div>
      </div>
    </div>
    <div class="page-tag">2 / 3</div>
  </section>

  <section class="slide slide-quote">
    <div class="slide-content">
      <div class="pull-quote">
        <span class="quote-mark">&ldquo;</span>
        <blockquote>示例金句——分享者原话里特别值得摘出来的一句，用词精炼、有画面感。</blockquote>
        <p class="attribution">分享者原话</p>
      </div>
    </div>
    <div class="page-tag">3 / 3</div>
  </section>

</div>

<script>
  // 页面翻页导航：方向键 / 空格 / PgUp / PgDn / Home / End / 触摸滑动 / 鼠标滚轮，
  // 跟 slides_style_template.html 同一套逻辑，原样复用，不改。
  (function () {
    let slides = Array.from(document.querySelectorAll('.slide'));
    let total = slides.length;
    let pageTags = Array.from(document.querySelectorAll('.page-tag'));

    function updatePageTag() {
      pageTags.forEach(tag => { tag.textContent = `${current + 1} / ${total}`; });
    }

    let current = slides.findIndex(s => s.classList.contains('active'));
    if (current < 0) current = 0;

    slides.forEach((s, i) => s.classList.toggle('active', i === current));
    updatePageTag();

    function go(n) {
      n = Math.max(0, Math.min(total - 1, n));
      if (n === current) return;
      slides[current].classList.remove('active');
      slides[n].classList.add('active');
      current = n;
      updatePageTag();
      window.scrollTo(0, 0);
    }

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        go(current + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault();
        go(current - 1);
      } else if (e.key === 'Home') {
        e.preventDefault();
        go(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        go(total - 1);
      }
    });

    let touchStartX = 0;
    let touchStartY = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 50 && Math.abs(dy) < 50) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        go(current + (dx < 0 ? 1 : -1));
      } else {
        go(current + (dy < 0 ? 1 : -1));
      }
    }, { passive: true });

    let wheelLocked = false;
    document.addEventListener('wheel', e => {
      if (wheelLocked) return;
      const primary = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(primary) < 5) return;
      go(current + (primary > 0 ? 1 : -1));
      wheelLocked = true;
      setTimeout(() => { wheelLocked = false; }, 700);
    }, { passive: true });

    // 2026-08-01 晶晶真实复现：之前是"整页 location.reload()"，靠 sessionStorage 记住翻到
    // 第几页再恢复——她实测发现这套在她的实际浏览环境里没能可靠恢复，每次内容更新都跳回
    // 第1页，体验上就像"内容一直没变/没有好几页"，完全没意识到已经生成了好几页。根治不是
    // 修 sessionStorage 那套逻辑，是干脆不整页刷新：内容变了只把 .presentation 的内容原地
    // 换成新版本，全程不 reload，current 这个变量本来就没被清过，天然停在原来那一页。
    let lastModified = null;
    async function checkForUpdate() {
      try {
        const res = await fetch(location.href, { method: 'GET', cache: 'no-store' });
        const lm = res.headers.get('Last-Modified');
        if (lastModified === null) { lastModified = lm; return; }
        if (!lm || lm === lastModified) return;  // 没变，什么都不做
        lastModified = lm;
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const newPresentation = doc.querySelector('.presentation');
        const oldPresentation = document.querySelector('.presentation');
        if (!newPresentation || !oldPresentation) { location.reload(); return; }  // 解析失败兜底
        oldPresentation.innerHTML = newPresentation.innerHTML;
        slides = Array.from(document.querySelectorAll('.slide'));
        total = slides.length;
        pageTags = Array.from(document.querySelectorAll('.page-tag'));
        current = Math.min(current, total - 1);  // 页数变化(通常是变多)时夹住范围，不跳页
        slides.forEach((s, i) => s.classList.toggle('active', i === current));
        updatePageTag();
      } catch (e) { /* 网络抖动，跳过这次，下个 tick 再试 */ }
    }
    setInterval(checkForUpdate, 5000);
  })();
</script>
</body>
</html>
